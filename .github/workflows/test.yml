name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run tests
        run: uv run --locked pytest tests

      - name: Verify explicit virtual equipment contract
        env:
          OEP_HW_CONFIG: tests/fixtures/hardware.virtual.toml
          OEP_HW_RESULTS: .pytest-results/equipment
        run: uv run --locked pytest tests/equipment --junitxml=.pytest-results/equipment.xml -o junit_family=legacy

      - name: Upload equipment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-equipment-evidence
          path: .pytest-results/

      - name: Build package
        run: uv build
