name: Release

on:
  workflow_dispatch:
    inputs:
      version_level:
        description: "Version component to bump (the version in pyproject.toml is the current one)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"
      version:
        description: "Release version instead (X.Y.Z, or X.Y.ZbN for a beta); empty: bump by version_level"
        required: false
        default: ""
      publish_pypi:
        description: "Publish package to PyPI"
        required: true
        type: boolean
        default: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run release preparation
        id: prepare
        env:
          VERSION: ${{ github.event.inputs.version }}
          LEVEL: ${{ github.event.inputs.version_level }}
        run: uv run python tools/prepare_release.py --version "$VERSION" --level "$LEVEL" --github-output "$GITHUB_OUTPUT"

      - name: Run tests
        run: uv run --locked pytest tests -n auto --dist loadfile   # files run side by side; most tests wait on real timeouts

      - name: Verify explicit virtual equipment contract
        id: equipment
        env:
          OEP_HW_CONFIG: tests/fixtures/hardware.virtual.toml
          OEP_HW_RESULTS: .pytest-results/equipment
        run: uv run --locked pytest tests/equipment --junitxml=.pytest-results/equipment.xml -o junit_family=legacy

      - name: Upload equipment evidence
        # only when the equipment step ran (a failed test step above skips it: nothing to upload)
        if: always() && steps.equipment.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: virtual-equipment-evidence
          path: .pytest-results/

      - name: Build package
        run: uv build

      - name: Commit release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock src/oep_client/__init__.py CHANGELOG.md
          git commit -m "chore(release): v${{ steps.prepare.outputs.version }}"

      - name: Create tag
        run: git tag "v${{ steps.prepare.outputs.version }}"

      - name: Push commit and tag
        run: |
          git push origin HEAD
          git push origin "v${{ steps.prepare.outputs.version }}"

  create_github_release:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: "v${{ needs.prepare.outputs.version }}"
          fetch-depth: 0

      - name: Build release body from CHANGELOG
        run: |
          VERSION="${{ needs.prepare.outputs.version }}" python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          version = os.environ["VERSION"]
          current_tag = f"v{version}"

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          section_header = f"## {version}"

          try:
              start = changelog.index(section_header)
          except ValueError as exc:
              raise SystemExit(f"Version section {section_header} not found in CHANGELOG.md") from exc

          end = len(changelog)
          for i in range(start + 1, len(changelog)):
              if changelog[i].startswith("## "):
                  end = i
                  break

          section = "\n".join(changelog[start:end]).strip()
          body = section + "\n\nRepository: https://github.com/Open-Embedded-Probe/oep-client-python"

          tags = (
              subprocess.check_output(
                  ["git", "tag", "--list", "v*", "--sort=v:refname"],
                  text=True,
              )
              .strip()
              .splitlines()
          )

          prev_tag = ""
          for i, tag in enumerate(tags):
              if tag == current_tag and i > 0:
                  prev_tag = tags[i - 1]
                  break

          if prev_tag:
              body += (
                  "\n\nFull Changelog: "
                  "https://github.com/Open-Embedded-Probe/oep-client-python/compare/"
                  f"{prev_tag}...{current_tag}"
              )

          Path("release_body.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.prepare.outputs.version }}"
          body_path: release_body.md
          generate_release_notes: false
          prerelease: ${{ contains(needs.prepare.outputs.version, 'a') || contains(needs.prepare.outputs.version, 'b') || contains(needs.prepare.outputs.version, 'rc') }}

  publish_pypi:
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ github.event.inputs.publish_pypi == 'true' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: "v${{ needs.prepare.outputs.version }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build package
        run: uv build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
