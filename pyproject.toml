[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oep-client-python"
version = "0.0.56"
description = "Open Embedded Probe (OEP) v1 host: serial / USB / TCP transports, the session rules, the standard interfaces, and a virtual bench"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "TANAKA Masayuki" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: Software Development :: Testing",
]
dependencies = ["pyserial>=3.5", "pyusb>=1.3", "libusb1>=3", "hidapi>=0.14", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
usb-async = []   # kept so `[usb-async]` still installs: libusb1 is a dependency now
hid = []         # kept so `[hid]` still installs: hidapi is a dependency now
mdns = ["zeroconf>=0.131"]   # DNS-SD browsing through python-zeroconf (oep find, tcp:UNIT_ID); without it a minimal query of its own
acquire = ["numpy>=2.0"]   # acquire: streams and capture format 1 blocks put together at once
pytest = ["pytest-embedded-arduino-cli>=1.12.0", "pexpect>=4.8"]   # the pytest plugin (oep_client.pytest_plugin): locks, port records, uploads

[project.scripts]
oep = "oep_client.__main__:main"
oep-conformance = "oep_client.conformance:main"
oep-hardware = "oep_client.hardware:main"

[project.entry-points.pytest11]
oep = "oep_client.pytest_plugin"

[project.urls]
Homepage = "https://github.com/Open-Embedded-Probe/oep-client-python"
Repository = "https://github.com/Open-Embedded-Probe/oep-client-python"

[tool.hatch.build.targets.wheel]
packages = ["src/oep_client"]

[tool.hatch.build.targets.sdist]
only-include = ["src/oep_client", "tests", "docs", "udev", "README.md", "README.ja.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "pexpect>=4.8"]

[tool.pytest.ini_options]
markers = ["hw: needs a probe board (OEP_HW_BOARDS=<board-identify ids>); skipped otherwise (tests/hw/README.md)",
           "equipment: explicit OEP_HW_CONFIG contract; skipped without equipment configuration"]
