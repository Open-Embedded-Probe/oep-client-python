[project]
name = "oep-client-prototype"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "pyusb>=1.3"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
