[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oep-client-python"
version = "0.0.12"
description = "Open Embedded Probe (OEP) v1 host: serial / USB / TCP transports, the session rules, the standard interfaces, and a fake probe"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "TANAKA Masayuki" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: Software Development :: Testing",
]
dependencies = ["pyserial>=3.5", "pyusb>=1.3"]

[project.optional-dependencies]
usb-async = ["libusb1>=3"]   # queued asynchronous IN transfers: streaming near the USB HS ceiling
hid = ["hidapi>=0.14"]      # the vendor HID way in through the OS HID driver (Windows without WinUSB, Linux hidraw)

[project.scripts]
oep = "oep_client.__main__:main"

[project.urls]
Homepage = "https://github.com/Open-Embedded-Probe/oep-client-python"
Repository = "https://github.com/Open-Embedded-Probe/oep-client-python"

[tool.hatch.build.targets.wheel]
packages = ["src/oep_client"]

[tool.hatch.build.targets.sdist]
only-include = ["src/oep_client", "tests", "README.md", "README.ja.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = ["pytest>=8"]
